<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<meta name="description" content="WHITE SAYY — marque streetwear. T-shirts oversize noirs, graphisme brut.">
<title>WHITE SAYY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --bg2:#0f0f0f; --card:#121212; --card2:#171717; --line:#1f1f1f; --line2:#2b2b2b;
  --text:#f2f0eb; --muted:#8d8b87; --muted2:#5c5b58; --white:#f2f0eb; --warn:#e8c26a;
  --r:20px; --pill:999px; --max:1240px; --hd:64px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --display:"Archivo",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0a0a0a;color:var(--text)}
html{scroll-behavior:smooth}
body{font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
img{display:block;max-width:100%}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 18px}
@media (min-width:900px){.wrap{padding:0 40px}}
main{flex:1;animation:pagein .45s var(--ease)}
@keyframes pagein{from{opacity:0}to{opacity:1}}

/* Typo */
.display{font-family:var(--display);font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:-.025em;line-height:.92}
.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.hero .eyebrow{color:var(--text);text-shadow:0 1px 14px rgba(10,10,10,.95),0 0 3px rgba(10,10,10,.9)}
.h2{font-family:var(--display);font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:-.02em;font-size:clamp(26px,4.4vw,44px);line-height:1;margin:0}
.muted{color:var(--muted)}
h1,h2,h3,h4{margin:0;font-weight:500}

/* Reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}main{animation:none}html{scroll-behavior:auto}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--white);color:#0a0a0a;font-weight:500;border-radius:var(--pill);padding:15px 28px;font-size:15px;transition:transform .2s var(--ease),opacity .2s;white-space:nowrap}
.btn:hover{opacity:.92}.btn:active{transform:scale(.98)}
.btn.full{width:100%}
.btn.lg{padding:18px 28px;font-size:16px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:#555}
.btn.sm{padding:9px 16px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:default}
.btn .i{width:18px;height:18px}
.ulink{text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
.ulink:hover{color:var(--text)}

/* Announcement + header */
.announce{background:var(--white);color:#0a0a0a;text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;font-weight:500}
header{position:sticky;top:0;z-index:40;transition:background .35s,border-color .35s;border-bottom:1px solid transparent}
header.solid{background:rgba(10,10,10,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-color:var(--line)}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:var(--hd)}
.hd .left,.hd .right{display:flex;align-items:center;gap:4px}
.hd .right{justify-content:flex-end}
.logo img{height:34px;width:auto}
.nav{display:none;gap:26px;font-size:14px}
.nav a{color:var(--muted);transition:color .2s;position:relative}
header:not(.solid) .nav a{color:var(--text);text-shadow:0 1px 12px rgba(10,10,10,.95),0 0 4px rgba(10,10,10,.85)}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--text);transform:scaleX(0);transition:transform .3s var(--ease);transform-origin:left}
.nav a:hover,.nav a.on{color:var(--text)}
.nav a.on::after,.nav a:hover::after{transform:scaleX(1)}
.ic{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;transition:background .2s}
.ic:hover{background:rgba(255,255,255,.06)}
.badge{position:absolute;top:4px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--white);color:#000;font-size:10px;font-weight:600;display:grid;place-items:center}
.badge[hidden]{display:none}
.badge.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.35)}}
.only-d{display:none}
@media (min-width:900px){
  .hd{grid-template-columns:auto 1fr auto;gap:40px}
  .logo img{height:38px}
  .nav{display:flex;justify-content:center}
  .only-m{display:none!important}.only-d{display:grid}
}

/* Mobile menu */
.mmenu{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding:18px 18px 30px;transform:translateY(-100%);transition:transform .5s var(--ease);visibility:hidden}
.mmenu.open{transform:none;visibility:visible}
.mmenu .top{display:flex;justify-content:space-between;align-items:center;height:46px}
.mmenu nav{margin-top:40px;display:flex;flex-direction:column;gap:6px}
.mmenu nav a{font-family:var(--display);font-weight:800;font-stretch:112%;text-transform:uppercase;font-size:34px;line-height:1.1;letter-spacing:-.02em;color:var(--muted)}
.mmenu nav a.on,.mmenu nav a:active{color:var(--text)}
.mmenu .bottom{margin-top:auto;display:flex;gap:20px;color:var(--muted);font-size:14px;flex-wrap:wrap}

/* Hero */
.hero{position:relative;height:calc(100svh - var(--hd));min-height:560px;max-height:980px;margin-top:calc(var(--hd) * -1);overflow:hidden;display:flex;align-items:flex-end;isolation:isolate}
.hero .bg{position:absolute;inset:-6% 0 0 0;z-index:-2;will-change:transform}
.hero .bg img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,10,10,.55) 0%,rgba(10,10,10,.15) 24%,rgba(10,10,10,.78) 48%,rgba(10,10,10,.95) 70%,rgba(10,10,10,1) 100%)}
.hero .inner{padding-bottom:56px;width:100%}
.hero h1{font-size:clamp(52px,13vw,168px);margin:16px 0 30px}
.hero h1 span{display:block}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.scrollcue{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--text);opacity:.85;display:flex;align-items:center;gap:10px}
.scrollcue i{display:block;width:1px;height:38px;background:linear-gradient(var(--text),transparent);animation:cue 2s infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media (min-width:900px){
  .hero .bg{left:46%}
  .hero .bg img{object-position:center 45%}
  .hero::after{background:linear-gradient(90deg,var(--bg) 46%,rgba(10,10,10,.35) 58%,rgba(10,10,10,0) 74%),linear-gradient(180deg,rgba(10,10,10,.92) 0%,rgba(10,10,10,.7) 5%,rgba(10,10,10,.3) 11%,rgba(10,10,10,0) 18%,rgba(10,10,10,0) 72%,var(--bg) 100%)}
  .hero{align-items:center}
  .hero .inner{padding-bottom:0;padding-top:var(--hd)}
  .hero h1{font-size:clamp(56px,6.4vw,104px);margin:18px 0 36px}
}

/* Sections */
.sec{padding:84px 0}
.sec-hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px}
@media (min-width:900px){.sec{padding:120px 0}}

/* Product cards */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px}
@media (min-width:900px){.pgrid{grid-template-columns:repeat(3,1fr);gap:40px 22px}}
.pgrid.solo{grid-template-columns:1fr}
@media (min-width:900px){.pgrid.solo{grid-template-columns:repeat(2,1fr)}}
.pc{display:block;position:relative}
.pc .im{position:relative;aspect-ratio:1/1;background:var(--card);overflow:hidden;border-radius:4px}
.pc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s var(--ease),transform 1.2s var(--ease)}
.pc .im img.b{opacity:0}
@media (hover:hover){.pc:hover .im img.a{opacity:0}.pc:hover .im img.b{opacity:1}.pc:hover .im img{transform:scale(1.035)}}
.pc .fill{position:absolute;inset:0}
.pc .tags{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:2;flex-wrap:wrap}
.tag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:3px;background:rgba(10,10,10,.75);color:var(--text);backdrop-filter:blur(6px)}
.tag.w{background:var(--white);color:#000}
.tag.warn{color:var(--warn)}
.pc .meta{display:flex;justify-content:space-between;gap:10px;padding:12px 2px 0;font-size:14px}
.pc .meta .n{font-weight:500;letter-spacing:.02em;text-transform:uppercase;font-size:13px}
.pc .meta small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;text-transform:none;letter-spacing:0;font-weight:400}
.pc .quick{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;opacity:0;transform:translateY(8px);transition:all .35s var(--ease)}
@media (hover:hover){.pc:hover .quick{opacity:1;transform:none}}
.quick .sz{display:flex;gap:4px;justify-content:center;background:rgba(10,10,10,.82);backdrop-filter:blur(8px);border-radius:999px;padding:5px}
.quick .sz button{flex:1;font-size:12px;padding:7px 0;border-radius:999px}
.quick .sz button:hover:not([disabled]){background:var(--white);color:#000}
.quick .sz button[disabled]{opacity:.3;text-decoration:line-through;cursor:default}

/* Categories */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:900px){.cats{grid-template-columns:repeat(4,1fr);gap:16px}}
.cat{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:4px;background:#fff;display:block}
.cat img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.cat:hover img{transform:scale(1.05)}
.cat span{position:absolute;inset:auto 0 0 0;padding:40px 14px 14px;background:linear-gradient(transparent,rgba(10,10,10,.85));display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.cat b{font-family:var(--display);font-weight:800;font-stretch:112%;text-transform:uppercase;font-size:clamp(18px,2.2vw,26px);letter-spacing:-.01em;line-height:1}
.cat i{font-style:normal;font-size:12px;color:#cfccc6;display:flex;gap:6px;align-items:center;white-space:nowrap}
.cat i .i{width:14px;height:14px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line2);border-radius:99px;padding:9px 16px;font-size:14px;white-space:nowrap;color:var(--muted);transition:all .2s}
.chip sup{font-size:10px;margin-left:4px;color:var(--muted2)}
.chip:hover{color:var(--text);border-color:#555}
.chip.on{background:var(--white);color:#000;border-color:var(--white)}
.chip.on sup{color:#555}
.incl{display:grid;gap:8px;margin:-6px 0 24px}
.incl a,.upsell{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:8px;font-size:13px;color:var(--muted);transition:border-color .2s}
.incl a:hover,.upsell:hover{border-color:#444}
.incl img,.upsell img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#fff;flex:none}
.incl b,.upsell b{display:block;color:var(--text);font-weight:500;font-size:13.5px}
.upsell{margin-top:14px;padding:10px 14px 10px 10px}
.upsell span{flex:1}

/* Editorial */
.edito{display:grid;gap:28px;align-items:center}
.edito .ph{aspect-ratio:1/1;overflow:hidden;border-radius:4px;background:#fff}
.edito .ph img{width:100%;height:100%;object-fit:cover}
.edito p.big{font-size:clamp(22px,2.6vw,32px);line-height:1.35;letter-spacing:-.01em;margin:18px 0 30px}
.promises{display:grid;gap:0;border-top:1px solid var(--line)}
.promises div{padding:16px 0;border-bottom:1px solid var(--line);color:var(--muted);display:flex;gap:14px;align-items:center;font-size:14.5px}
.promises div::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--text);flex:none}
@media (min-width:900px){.edito{grid-template-columns:1fr 1fr;gap:80px}}

/* Marquee */
.marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;white-space:nowrap}
.marquee .t{display:inline-flex;gap:48px;animation:mq 32s linear infinite;padding-right:48px}
.marquee span{font-family:var(--display);font-weight:800;font-stretch:112%;text-transform:uppercase;font-size:clamp(28px,5vw,56px);letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1px #4a4a4a}
.marquee span.f{color:var(--text);-webkit-text-stroke:0}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marquee .t{animation:none}}

/* Reviews / UGC */
.stars{display:inline-flex;gap:2px;color:var(--text)}
.stars svg{width:14px;height:14px;fill:currentColor}
.stars .off{color:#3a3a3a}
.rgrid{display:grid;gap:14px}
@media (min-width:900px){.rgrid{grid-template-columns:repeat(3,1fr)}}
.rev{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.rev img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.rev .who{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.ugc{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:900px){.ugc{grid-template-columns:repeat(4,1fr);gap:12px}}
.ugc a{position:relative;aspect-ratio:1;overflow:hidden;border-radius:4px;background:var(--card)}
.ugc img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.ugc a:hover img{transform:scale(1.05)}
.ugc span{position:absolute;left:10px;bottom:10px;font-size:12px;background:rgba(10,10,10,.7);padding:4px 8px;border-radius:99px}

/* Shop toolbar */
.pagehd{padding:40px 0 26px}
.pagehd h1{font-size:clamp(44px,9vw,96px)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px;position:sticky;top:var(--hd);background:rgba(10,10,10,.92);backdrop-filter:blur(12px);z-index:5}
.toolbar .l{display:flex;gap:8px;flex-wrap:wrap}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;background:var(--card);border:1px solid var(--line2);border-radius:var(--pill);color:var(--text);font:inherit;font-size:13.5px;padding:9px 34px 9px 15px;cursor:pointer}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.count{font-size:13px;color:var(--muted)}

/* Product page */
.crumb{font-size:12.5px;color:var(--muted);padding:18px 0}
.crumb a:hover{color:var(--text)}
.pp{display:grid;gap:26px;padding-bottom:40px}
.gal{position:relative;margin:0 -18px}
.gal .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal .track::-webkit-scrollbar{display:none}
.gal .slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:1/1;background:var(--card);overflow:hidden;cursor:zoom-in}
.gal .slide img{width:100%;height:100%;object-fit:cover}
.dots{display:flex;gap:6px;justify-content:center;position:absolute;bottom:14px;left:0;right:0}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:all .3s}
.dots i.on{background:#fff;width:18px;border-radius:3px}
.gcount{position:absolute;top:12px;right:12px;font-size:12px;background:rgba(10,10,10,.7);padding:4px 9px;border-radius:99px}
.info h1{font-size:clamp(34px,4.6vw,56px);margin-bottom:10px}
.info .sub{color:var(--muted)}
.info .prow{display:flex;align-items:center;justify-content:space-between;margin:18px 0}
.info .price{font-size:22px}
.heart{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;transition:all .2s}
.heart svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6}
.heart.on svg{fill:currentColor}
.heart.on{animation:pop .45s var(--ease)}
.desc{color:var(--muted);line-height:1.7;margin:0 0 26px}
.szhd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-size:14px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:500px){.sizes{grid-template-columns:repeat(6,1fr)}}
.size{position:relative;height:54px;border:1px solid var(--line2);border-radius:12px;font-size:15px;font-weight:500;transition:all .18s var(--ease);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.size small{font-size:10px;font-weight:400;color:var(--warn);margin-top:3px;letter-spacing:.02em}
.size:hover:not([disabled]){border-color:#666}
.size.on{background:var(--white);color:#000;border-color:var(--white)}
.size.on small{color:#7a5a12}
.size[disabled]{color:var(--muted2);cursor:default;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.03) 6px 7px)}
.size[disabled]::after{content:"";position:absolute;left:16%;right:16%;top:50%;height:1px;background:var(--muted2);transform:rotate(-14deg)}
.stockmsg{min-height:22px;margin:12px 0 14px;font-size:13.5px;color:var(--warn);display:flex;align-items:center;gap:8px}
.stockmsg.ok{color:var(--muted)}
.pulse{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25}}
.acc{border-top:1px solid var(--line);margin-top:28px}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;padding:18px 0;display:flex;justify-content:space-between;align-items:center;font-size:14.5px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:20px;font-weight:300;transition:transform .3s var(--ease)}
.acc details[open] summary::after{transform:rotate(45deg)}
.acc .b{padding:0 0 20px;color:var(--muted);font-size:14.5px;line-height:1.7}
.acc ul{margin:0;padding-left:18px}
.v360l{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 12px;font-size:14px}
.v360{position:relative;border-radius:4px;overflow:hidden;background:var(--card);aspect-ratio:480/565;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.spin{position:relative;aspect-ratio:1/1;background:#fff;border-radius:4px;overflow:hidden;perspective:1600px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.spin-in{position:absolute;inset:4%;transform-style:preserve-3d;will-change:transform}
.spin-in img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:none}
.spin-in img.b{transform:rotateY(180deg)}
.spin .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(10,10,10,.8);backdrop-filter:blur(6px);font-size:12.5px;padding:8px 14px;border-radius:99px;display:flex;gap:8px;align-items:center;white-space:nowrap;color:var(--text)}
.spin .hint .i{width:15px;height:15px}
.v360 .sprite{width:100%;height:100%;background-size:600% 400%;background-position:0 0;background-repeat:no-repeat;pointer-events:none}
.v360 .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(10,10,10,.75);backdrop-filter:blur(6px);font-size:12.5px;padding:8px 14px;border-radius:99px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.v360 .hint .i{width:15px;height:15px}
.v360 .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--text);transition:width .1s}

const stockOf = (p, s) => {
  if(isSet(p)){ const [a, b] = String(s).split(" / "); const [x, y] = parts(p); return x && y ? Math.min(stockOf(x, a), stockOf(y, b)) : 0; }
  return Math.max(0, +(p.sizes?.[s] ?? 0));
};
const totalStock = p => isSet(p) ? Math.min(...parts(p).map(c => c ? totalStock(c) : 0)) : Object.values(p.sizes || {}).reduce((a,b) => a + Math.max(0,+b||0), 0);
const canSpin = p => false;
const sizesOf = p => SIZES.filter(s => s in (p.sizes || {}));
const compareAt = p => isSet(p) ? parts(p).reduce((a,c) => a + (c ? +c.price : 0), 0) : 0;
const priceHtml = p => { const c = compareAt(p); return c > p.price ? `<span>${eur(p.price)}</span> <s class="muted" style="font-size:.85em;margin-left:6px">${eur(c)}</s>` : eur(p.price); };
const sizeLabel = (p, s) => isSet(p) ? (() => { const [a,b] = String(s).split(" / "); return `Sweat ${a} · Jogging ${b}`; })() : `Taille ${s}`;
function relatedOf(p){
  if(p.related?.length) return p.related.map(findP).filter(x => x && x.active !== false);
  const all = products().filter(x => x.id !== p.id && !(isSet(p) && p.components.includes(x.id)));
  const same = all.filter(x => x.line && x.line === p.line);
  const comp = all.filter(x => !same.includes(x) && (p.category === "tshirt" ? x.category === "tshirt" : x.category !== p.category && x.category !== "tshirt"));
  const rest = all.filter(x => !same.includes(x) && !comp.includes(x));
  return [...same, ...comp, ...rest].slice(0, 4);
}

function addToCart(id, size){

/* Apparition au scroll */
let io = null;
function observe(){
  const els = document.querySelectorAll(".rv:not(.in)");
  if(reduceMotion || !("IntersectionObserver" in window)){ els.forEach(e => e.classList.add("in")); return; }
  io ??= new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {rootMargin:"0px 0px -8% 0px", threshold:.08});
  els.forEach(e => io.observe(e));
}
function headerState(){
  const onHero = document.body.dataset.page === "home" && scrollY < 40;
  $("#hdr").classList.toggle("solid", !onHero);
}
let ticking = false;
addEventListener("scroll", () => {
  if(ticking) return; ticking = true;
  requestAnimationFrame(() => {
    headerState();
    const bg = document.querySelector(".hero .bg");
    if(bg && !reduceMotion && scrollY < innerHeight * 1.2) bg.style.transform = `translate3d(0,${scrollY*0.28}px,0) scale(${1 + scrollY*0.00015})`;

function pShop(){
  const cat = query.cat || "", sort = query.tri || "nouveautes", size = query.taille || "", price = query.prix || "";
  let list = products();
  if(cat) list = list.filter(p => p.category === cat);
  if(size) list = list.filter(p => isSet(p) ? parts(p).every(c => c && stockOf(c, size) > 0) : stockOf(p, size) > 0);
  if(price === "lt40") list = list.filter(p => p.price < 40);
  if(price === "40-60") list = list.filter(p => p.price >= 40 && p.price <= 60);
  if(price === "gt60") list = list.filter(p => p.price > 60);
  const order = shop.products.map(p => p.id);
  list = [...list].sort({
    nouveautes:(a,b) => (b.isNew - a.isNew) || String(b.createdAt).localeCompare(String(a.createdAt)) || order.indexOf(a.id) - order.indexOf(b.id),
    "prix-asc":(a,b) => a.price - b.price, "prix-desc":(a,b) => b.price - a.price
  }[sort] || (() => 0));
  const opt = (v, l, cur) => `<option value="${v}" ${v===cur?"selected":""}>${l}</option>`;
  const link = c => { const q = {...query, cat:c}; if(!c) delete q.cat; const qs = new URLSearchParams(q).toString(); return "#/boutique" + (qs ? "?" + qs : ""); };
  const cats = CATS.filter(([k]) => products().some(p => p.category === k));
  return {title: cat ? catName(cat) : "Boutique", html:`
  <div class="wrap">
    <div class="pagehd"><div class="eyebrow rv">${cat ? "Boutique" : "Collection"}</div><h1 class="display rv d1" style="margin-top:12px">${cat ? catName(cat) : "Boutique"}</h1></div>
    <div class="chips rv">${[["", "Tout", products().length], ...cats.map(([k,l]) => [k, l, products().filter(p => p.category === k).length])].map(([k,l,n]) => `<a href="${link(k)}" class="chip ${k===cat?"on":""}">${l}<sup>${n}</sup></a>`).join("")}</div>
    <div class="toolbar">
      <div class="l">
        <div class="sel"><select data-filter="tri" aria-label="Trier">${opt("nouveautes","Nouveautés",sort)}${opt("prix-asc","Prix croissant",sort)}${opt("prix-desc","Prix décroissant",sort)}</select></div>
        <div class="sel"><select data-filter="taille" aria-label="Taille"><option value="">Toutes tailles</option>${SIZES.map(s => opt(s, "Taille " + s, size)).join("")}</select></div>
        <div class="sel"><select data-filter="prix" aria-label="Prix"><option value="">Tous les prix</option>${opt("lt40","Moins de 40 €",price)}${opt("40-60","40 à 60 €",price)}${opt("gt60","Plus de 60 €",price)}</select></div>
      </div>
      <span class="count">${list.length} article${list.length>1?"s":""}</span>
    </div>
    ${list.length ? `<div class="pgrid" style="margin-bottom:100px">${list.map(card).join("")}</div>`
      : `<div class="empty" style="margin-bottom:60px"><p>Aucun article ne correspond à ces filtres.</p><a class="btn ghost" href="#/boutique${cat ? "?cat=" + cat : ""}">Réinitialiser</a></div>`}
  </div>`};
}

function mountSpin(){
  const box = $("#spin"), inner = $("#spinIn"), side = $("#spinSide");
  let ang = 0, sx = 0, sa = 0, drag = false, raf = null;
  const draw = () => {
    const a = ((ang % 360) + 360) % 360, s = Math.abs(Math.sin(ang * Math.PI / 180));
    inner.style.transform = `rotateY(${ang}deg) scale(${1 - s * .06})`;
    side.textContent = a > 90 && a < 270 ? "Dos" : "Face";
  };
  const stop = () => { cancelAnimationFrame(raf); raf = null; };
  box.addEventListener("pointerdown", e => { stop(); drag = true; sx = e.clientX; sa = ang; box.style.cursor = "grabbing"; box.setPointerCapture?.(e.pointerId); });
  box.addEventListener("pointermove", e => { if(drag){ ang = sa + (e.clientX - sx) * 360 / Math.max(260, box.clientWidth); draw(); } });
  const up = () => { if(!drag) return; drag = false; box.style.cursor = "";
    const target = Math.round(ang / 180) * 180, from = ang, t0 = performance.now();
    const ease = now => { const k = Math.min(1, (now - t0) / 380); ang = from + (target - from) * (1 - Math.pow(1 - k, 3)); draw(); if(k < 1) raf = requestAnimationFrame(ease); };
    raf = requestAnimationFrame(ease); };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
  box.addEventListener("keydown", e => { if(e.key === "ArrowLeft" || e.key === "ArrowRight"){ stop(); ang += e.key === "ArrowLeft" ? -180 : 180; inner.style.transition = "transform .6s var(--ease)"; draw(); setTimeout(() => inner.style.transition = "", 650); } });
  draw();
  if(!reduceMotion && "IntersectionObserver" in window){
    let played = false;
    const o = new IntersectionObserver(([e]) => { if(e.isIntersecting && !played){ played = true; const t0 = performance.now();
      const turn = now => { const k = Math.min(1, (now - t0) / 2600); ang = 360 * (k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2); draw(); if(k < 1) raf = requestAnimationFrame(turn); else { ang = 0; draw(); } };
      raf = requestAnimationFrame(turn); } }, {threshold:.6});
    o.observe(box); teardown.push(() => { o.disconnect(); stop(); });
  }
}
function mount360(frames){
  const box = $("#v360"), im = $("#v360img"), n = $("#v360n"), bar = $("#v360bar");
  const pre = () => {};
  let idx = 0, sx = 0, si = 0, drag = false, auto = null;
  const step = () => Math.max(6, box.clientWidth / frames.length / 1.1);
  const go = i => { idx = ((i % frames.length) + frames.length) % frames.length; im.style.backgroundPosition = `${(idx % 6) * 20}% ${Math.floor(idx / 6) * 100 / 3}%`; n.textContent = idx + 1; bar.style.width = ((idx+1)/frames.length*100) + "%"; };
  box.addEventListener("pointerdown", e => { pre(); stopAuto(); drag = true; sx = e.clientX; si = idx; box.style.cursor = "grabbing"; box.setPointerCapture?.(e.pointerId); });
  box.addEventListener("pointermove", e => { if(drag) go(si + Math.round((sx - e.clientX) / step())); });
  const up = () => { drag = false; box.style.cursor = ""; };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
  box.addEventListener("keydown", e => { if(e.key === "ArrowLeft"){ stopAuto(); go(idx-1); } if(e.key === "ArrowRight"){ stopAuto(); go(idx+1); } });
  const stopAuto = () => { clearInterval(auto); auto = null; };
  if(!reduceMotion && "IntersectionObserver" in window){
    let played = false;
    const o = new IntersectionObserver(([e]) => { if(e.isIntersecting && !played){ played = true; pre(); let c = 0; auto = setInterval(() => { go(idx+1); if(++c >= frames.length - 1) stopAuto(); }, 110); } }, {threshold:.6});
    o.observe(box); teardown.push(() => { o.disconnect(); stopAuto(); });
  }
}

function mountAuth(){

    const email = f.email.value.trim().toLowerCase(), h = await hash(email + "|" + f.password.value);
    const users = read(K.users, []);

      if(users.some(u => u.email === email)) return toast("Ce compte existe déjà");
      users.push({email, h, admin: !users.some(u => u.admin)}); write(K.users, users);

const getPath = (o, p) => p.split(".").reduce((a,k) => a?.[k], o);
function setPath(o, p, v){ const ks = p.split("."); const last = ks.pop(); const t = ks.reduce((a,k) => a[k], o); t[last] = v; }
function saveDraft(silent){ shop._dirty = true; if(write(K.draft, shop) && !silent) flashSaved(); }
function flashSaved(){ const b = $("#savedTag"); if(b){ b.textContent = "Enregistré"; clearTimeout(flashSaved.t); flashSaved.t = setTimeout(() => b.textContent = "", 1400); } }
function compress(file, max = 1100, q = .82){
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = rej;
    r.onload = () => { const im = new Image(); im.onerror = () => rej(new Error("Image illisible")); im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement("canvas");
      c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", q)); }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}

      <div class="fld"><label class="f">Produit</label><select class="in" data-bind="reviews.${i}.productId" data-type="text"><option value="">Tous</option>${s.products.map(p => `<option value="${p.id}" ${r.productId===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div></div>
      ${F(`reviews.${i}.text`,"Avis","area")}<div class="fld"><label class="f">Photo (facultatif)</label>${thumbs(`reviews.${i}.photo`, r.photo ? [r.photo] : [])}</div>
      <button class="btn ghost sm" style="color:#e88;margin-top:12px" data-act="revdel" data-i="${i}">Supprimer</button></div></details>`).join("") + `<button class="btn ghost full" data-act="revadd">+ Ajouter un avis reçu</button>`;
  else if(admTab === "ugc") body = `<p class="note" style="margin-top:0">Photos de clients qui portent WHITE SAYY (avec leur accord). La section s'affiche sur l'accueil dès qu'il y a une photo.</p>` +
    s.ugc.map((g,i) => `<div class="card" style="display:flex;gap:14px;align-items:flex-start"><img src="${img(g.photo)}" style="width:80px;height:80px;object-fit:cover;border-radius:8px" alt=""><div style="flex:1">${F(`ugc.${i}.handle`,"Pseudo Instagram")}${F(`ugc.${i}.link`,"Lien vers la publication (facultatif)")}<button class="btn ghost sm" style="color:#e88;margin-top:10px" data-act="ugcdel" data-i="${i}">Retirer</button></div></div>`).join("") +
    `<label class="btn ghost full" style="cursor:pointer">+ Ajouter des photos<input type="file" accept="image/*" multiple hidden data-upload="ugc"></label>`;
  else if(admTab === "commandes"){
    const orders = read(K.orders, []);
    body = `<div class="card"><b>Envoyer un suivi de colis</b><p class="note">Prépare l'e-mail d'expédition pour ton client avec le lien de suivi.</p>
      <form class="form" id="shipForm"><div class="grid2"><input name="email" type="email" placeholder="E-mail du client" required><input name="order" placeholder="N° de commande" required></div>
      <div class="grid2"><input name="code" placeholder="N° de suivi" required><select class="in" name="carrier"><option value="laposte">La Poste / Colissimo</option><option value="chronopost">Chronopost</option><option value="other">Autre</option></select></div>
      <button class="btn" type="submit">Préparer l'e-mail</button></form></div>
      <p class="note">Les commandes arrivent sur ton e-mail de contact. Celles passées sur cet appareil apparaissent ci-dessous.</p>
      ${orders.length ? orders.map(o => orderCard(o, true)).join("") : `<div class="card muted">Aucune commande sur cet appareil.</div>`}`;
  }
  else body = `<div class="card"><b>Mettre en ligne tes modifications</b>
      <p class="muted" style="font-size:14px;line-height:1.7">Tes réglages sont pour l'instant enregistrés seulement dans ce navigateur. Pour que tous les visiteurs les voient :</p>
      <ol class="muted" style="font-size:14px;line-height:1.9;padding-left:20px;margin:0 0 16px"><li>Télécharge le site mis à jour.</li><li>Sur GitHub, dans le dossier <b style="color:var(--text)">public/</b>, remplace <b style="color:var(--text)">white-sayy.html</b> par ce fichier.</li><li>Lovable se met à jour tout seul (pense à republier si besoin).</li></ol>
      <button class="btn full lg" data-act="export">Télécharger le site mis à jour</button></div>
    <div class="card"><b>Sauvegarde</b><p class="note">Exporte ou restaure tous les réglages, produits, avis et photos.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-act="expjson">Exporter (JSON)</button><label class="btn ghost sm" style="cursor:pointer">Importer (JSON)<input type="file" accept=".json,application/json" hidden id="impjson"></label>${shop._dirty ? `<button class="btn ghost sm" style="color:#e88" data-act="discard">Annuler mes modifications</button>` : ""}</div></div>`;
  return {title:"Admin", html:`<div class="wrap adm" style="padding-bottom:100px;max-width:860px">
    <div class="pagehd" style="padding-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px"><div><div class="eyebrow">${esc(u.email)}</div><h1 class="display" style="font-size:clamp(36px,6vw,60px);margin-top:10px">Admin</h1></div><span class="muted" id="savedTag" style="font-size:13px"></span></div>
    ${shop._dirty && admTab !== "publier" ? `<div class="warnbar"><span>Modifications enregistrées sur cet appareil, pas encore en ligne.</span><a class="btn sm" href="#/admin" data-act="tab" data-t="publier">Publier</a></div>` : ""}
    <div class="tabs">${tabs.map(([k,l]) => `<button class="${k===admTab?"on":""}" data-act="tab" data-t="${k}">${l}</button>`).join("")}<button data-act="logout">Déconnexion</button></div>
    ${body}</div>`, mount: mountAdmin};
}
function mountAdmin(){
  const root = $(".adm"); if(!root) return;
  root.addEventListener("change", async e => {
    const el = e.target;
    if(el.dataset.bind){
      const t = el.dataset.type; let v = el.value;
      if(t === "num") v = parseFloat(String(v).replace(",", ".")) || 0;
      if(t === "bool") v = el.checked;
      if(t === "lines") v = v.split("\n").map(x => x.trim()).filter(Boolean);
      setPath(shop, el.dataset.bind, v); saveDraft();
      if(/\.(name|price)$/.test(el.dataset.bind)){ const sm = el.closest("details")?.querySelector("summary b"); if(sm && /name$/.test(el.dataset.bind)) sm.textContent = v; }
      if(!$(".warnbar") || /\.category$/.test(el.dataset.bind)) render();
    }
    else if(el.dataset.setpart !== undefined){
      const p = shop.products[+el.dataset.setpart]; p.components = p.components || ["",""]; p.components[+el.dataset.j] = el.value; saveDraft(); render();
    }
    else if(el.dataset.stock !== undefined){
      const p = shop.products[+el.dataset.stock];
      if(el.value === "") delete p.sizes[el.dataset.s]; else p.sizes[el.dataset.s] = Math.max(0, parseInt(el.value) || 0);
      saveDraft();
    }
    else if(el.dataset.upload){
      const files = [...el.files]; if(!files.length) return;
      toast("Optimisation des images…");
      try{
        const urls = []; for(const f of files) urls.push(await compress(f, el.dataset.upload === "ugc" ? 900 : 1200));
        const path = el.dataset.upload;
        if(path === "ugc") urls.forEach(u => shop.ugc.push({photo:u, handle:"", link:""}));
        else{ const cur = getPath(shop, path); if(Array.isArray(cur)) cur.push(...urls); else setPath(shop, path, urls[0]); }
        saveDraft(); render(); toast(`${urls.length} image(s) ajoutée(s)`);
      }catch(err){ toast(err.message || "Image illisible"); }
    }
    else if(el.id === "impjson"){
      const f = el.files[0]; if(!f) return;
      try{ const d = JSON.parse(await f.text()); if(!d.products || !d.settings) throw 0; shop = merge(DEFAULTS, d); saveDraft(); render(); toast("Données importées"); }
      catch(err){ toast("Ce fichier n'est pas une sauvegarde WHITE SAYY"); }
    }
  });
  const sf = $("#shipForm");
  sf && sf.addEventListener("submit", e => { e.preventDefault(); if(!sf.reportValidity()) return;
    const url = trackUrl(sf.code.value.trim(), sf.carrier.value);
    location.href = `mailto:${encodeURIComponent(sf.email.value.trim())}?subject=${encodeURIComponent(`WHITE SAYY — ta commande ${sf.order.value} est en route`)}&body=${encodeURIComponent(`Bonjour,\n\nTa commande n° ${sf.order.value} vient d'être expédiée.\nNuméro de suivi : ${sf.code.value}\nSuivre le colis : ${url}\n\nMerci pour ta confiance,\nWHITE SAYY`)}`; });
}
async function exportSite(){
  const data = structuredClone(shop); delete data._dirty; data.publishedAt = new Date().toISOString();
  const A = "/*SHOP_" + "DATA_START*/", B = "/*SHOP_" + "DATA_END*/";
  let src;
  try{ const r = await fetch(location.href.split("#")[0], {cache:"no-store"}); if(!r.ok) throw 0; src = await r.text(); }catch(e){ src = null; }
  if(!src || !src.includes(A) || !src.includes(B)){ toast("Téléchargement impossible ici : exporte le JSON et ouvre le site en ligne"); return; }
  const json = JSON.stringify(data).replace(/</g, "\\u003c").replace(/\u2028|\u2029/g, "");
  const out = src.slice(0, src.indexOf(A) + A.length) + json + src.slice(src.indexOf(B));
  download("white-sayy.html", out, "text/html");
  shop._dirty = false; shop.publishedAt = data.publishedAt; write(K.draft, shop);
  toast("Fichier prêt : dépose-le dans public/ sur GitHub"); render();
}
function download(name, content, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([content], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

/* ============ Recherche ============ */
function openSearch(){
  const was = $("#search").classList.contains("open"); closeAll(); if(was) return;
  $("#search").classList.add("open"); $("#ov").classList.add("open"); openPanel = "search"; $("#q").value = ""; searchRes(""); setTimeout(() => $("#q").focus(), 60);
}
function searchRes(v){
  const t = v.trim().toLowerCase();
  const list = products().filter(p => !t || `${p.name} ${p.subtitle} ${p.tagline} ${catName(p.category)} ${catName(p.category, 1)} ${p.description} ${p.details.join(" ")}`.toLowerCase().includes(t));
  $("#qres").innerHTML = list.length ? list.map(p => `<a href="#/produit/${p.id}"><img src="${img(p.images[0])}" alt=""><b style="font-weight:500">${esc(p.name)}</b><br><span class="muted">${eur(p.price)}</span></a>`).join("") : `<span class="muted" style="padding:10px 0">Aucun résultat.</span>`;
}
$("#q").addEventListener("input", e => searchRes(e.target.value));

/* ============ Actions ============ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act;
  const p = el.dataset.id ? findP(el.dataset.id) : null;
  switch(a){
    case "menu": { const m = $("#mmenu"), o = m.classList.contains("open"); closeAll(); if(!o){ m.classList.add("open"); lock(true); } break; }
    case "search": openSearch(); break;
    case "cart": openDrawer(); break;
    case "close": closeAll(); break;
    case "qty": { const i = cart[+el.dataset.k], pp = findP(i.id); const n = i.qty + +el.dataset.d; if(n > stockOf(pp, i.size)){ toast(`Plus que ${stockOf(pp,i.size)} (${sizeLabel(pp, i.size)})`); break; } i.qty = n; saveCart(); break; }
    case "rm": cart.splice(+el.dataset.k, 1); saveCart(); break;
    case "size": { if(el.dataset.w === "2") sel.size2 = el.dataset.s; else sel.size = el.dataset.s; updateSizeUI(findP(sel.id)); break; }
    case "scrollsize": $(".sizes").scrollIntoView({behavior:"smooth", block:"center"}); break;
    case "add": { const pk = findP(el.dataset.id), key = selKey(pk); if(!key){ toast(isSet(pk) ? (sel.size ? "Choisis la taille du jogging" : "Choisis la taille du sweat") : "Choisis ta taille"); $(".sizes").scrollIntoView({behavior:"smooth", block:"center"}); document.querySelectorAll(".size:not([disabled])").forEach(b => b.animate([{transform:"translateX(0)"},{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"translateX(0)"}],{duration:300})); break; } addToCart(el.dataset.id, key); break; }
    case "quick": e.preventDefault(); addToCart(el.dataset.id, el.dataset.s); break;
    case "fav": { let f = read(K.favs, []); const id = el.dataset.id; f = f.includes(id) ? f.filter(x => x !== id) : [...f, id]; write(K.favs, f); el.classList.toggle("on", f.includes(id)); toast(f.includes(id) ? "Ajouté aux favoris" : "Retiré des favoris"); break; }
    case "guide": sizeGuide(); break;
    case "zoom": openLightbox(findP(sel.id), +el.dataset.i); break;
    case "lbnav": { const tr = $("#lbTrack"); tr.scrollBy({left: tr.clientWidth * +el.dataset.d, behavior:"smooth"}); break; }
    case "review": reviewForm(el.dataset.id); break;
    case "track": { const v = document.querySelector(`[data-track="${el.dataset.id}"]`).value.trim(); if(!v){ toast("Saisis ton numéro de suivi"); break; }
      const os = read(K.orders, []); const o = os.find(x => x.id === el.dataset.id); if(o){ o.tracking = v; write(K.orders, os); } openTracking(v, "laposte"); break; }
    case "authMode": authMode = authMode === "login" ? "signup" : "login"; render(); break;
    case "logout": localStorage.removeItem(K.session); toast("Déconnecté"); render(); break;
    case "tab": e.preventDefault(); admTab = el.dataset.t; render(); break;
    case "padd": shop.products.push({id:"produit-" + uid().toLowerCase(), category:"tshirt", line:"", components:[], name:"Nouveau produit", subtitle:"", tagline:"", price:0, description:"", details:[], care:"", sizes:{XS:0,S:0,M:0,L:0,XL:0,XXL:0}, images:[], has360:false, isNew:true, active:false, createdAt:new Date().toISOString().slice(0,10), related:[]}); saveDraft(); render(); break;
    case "pdel": if(confirm("Supprimer ce produit ?")){ shop.products.splice(+el.dataset.i, 1); saveDraft(); render(); } break;
    case "imgdel": { const cur = getPath(shop, el.dataset.path); if(Array.isArray(cur)) cur.splice(+el.dataset.i, 1); else setPath(shop, el.dataset.path, el.dataset.path === "settings.heroImage" ? "hero" : ""); saveDraft(); render(); break; }
    case "imgmove": { const cur = getPath(shop, el.dataset.path), i = +el.dataset.i; if(Array.isArray(cur) && i > 0){ [cur[i-1], cur[i]] = [cur[i], cur[i-1]]; saveDraft(); render(); } break; }
    case "revadd": shop.reviews.unshift({name:"", rating:5, text:"", photo:"", size:"", productId:"", date:new Date().toISOString().slice(0,10)}); saveDraft(); render(); setTimeout(() => document.querySelector(".adm details.card")?.setAttribute("open",""), 0); break;
    case "revdel": shop.reviews.splice(+el.dataset.i, 1); saveDraft(); render(); break;
    case "ugcdel": shop.ugc.splice(+el.dataset.i, 1); saveDraft(); render(); break;
    case "export": exportSite(); break;
    case "expjson": { const d = structuredClone(shop); delete d._dirty; download(`white-sayy-donnees-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(d, null, 1), "application/json"); break; }
    case "discard": if(confirm("Revenir à la version en ligne ? Tes modifications non publiées seront perdues.")){ localStorage.removeItem(K.draft); shop = merge(DEFAULTS, PUBLISHED || {}); render(); toast("Modifications annulées"); } break;
  }
});
document.addEventListener("change", e => {
  const f = e.target.dataset?.filter; if(!f) return;
  const q = {...query, [f]: e.target.value}; Object.keys(q).forEach(k => !q[k] && delete q[k]);
  const qs = new URLSearchParams(q).toString(); history.replaceState(null, "", "#/boutique" + (qs ? "?" + qs : "")); render();
});

/* ============ Démarrage ============ */
document.querySelectorAll(".logoimg").forEach(i => i.src = IMG.logo);
$("#year").textContent = new Date().getFullYear();
$("#ftTag").textContent = "Une identité. Des pièces noires, un graphisme brut, rien de superflu.";
if(S().announcement) $("#announce").innerHTML = `<div class="announce">${esc(S().announcement)}</div>`;
if(S().instagram) $("#ftIg").innerHTML = `<a target="_blank" rel="noopener" href="https://instagram.com/${encodeURIComponent(S().instagram.replace(/^@/,""))}">Instagram</a>`;
badge(); render();
</script>
